[package]
name = "mats_os_server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-web-actors = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
rand = "0.8"
hex = "0.4"
actix = "0.13"
uuid = { version = "1", features = ["v4"] }
regex = "1"
