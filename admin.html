<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // Admin Console</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-family: monospace; color: #aaa; }
        input, textarea { padding: 10px; background: #111; color: #00ff00; border: 1px solid #333; font-family: monospace; }
        input:focus, textarea:focus { border-color: #0076ff; outline: none; }
        button { padding: 12px; background: #0076ff; color: white; border: none; cursor: pointer; font-family: monospace; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; font-family: monospace; padding: 10px; border: 1px dashed #555; display: none; }
    </style>
</head>
<body>

<div class="window" style="max-width: 650px; margin: 40px auto;">
    <div class="title-bar">
        <span>ADMIN_CONSOLE // WRITE_ACCESS</span>
        <a href="index.html" class="nav-back"><- TILBAKE</a>
    </div>
    <div class="content">
        <h1>Opprett nytt innlegg</h1>
        
        <form id="postForm">
            <div class="form-group">
                <label for="secretKey">SECRET_KEY (X-API-KEY):</label>
                <input type="password" id="secretKey" required placeholder="Lim inn miljøvariabelen fra Render">
            </div>

            <div class="form-group">
                <label for="title">Tittel:</label>
                <input type="text" id="title" required placeholder="F.eks. Enda en seier over Rust-kompilatoren">
            </div>

            <div class="form-group">
                <label for="date">Dato (Tekst):</label>
                <input type="text" id="date" required>
            </div>

            <div class="form-group">
                <label for="timestamp">Timestamp:</label>
                <input type="number" id="timestamp" required>
            </div>

            <div class="form-group">
                <label for="content">Innhold:</label>
                <textarea id="content" rows="8" required placeholder="Skriv innlegget ditt her..."></textarea>
            </div>

            <button type="submit">PUBLISER INNLEGG</button>
        </form>

        <div id="status"></div>
    </div>
</div>

<script>
    // Automagisk utfylling av tid, så du slipper å tenke
    const datoValg = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('date').value = new Date().toLocaleDateString('no-NO', datoValg);
    document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);

    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.style.color = '#fff';
        statusDiv.innerText = 'Sender forespørsel...';

        const payload = {
            title: document.getElementById('title').value,
            date: document.getElementById('date').value,
            timestamp: parseInt(document.getElementById('timestamp').value),
            content: document.getElementById('content').value
        };

        try {
            const response = await fetch('/api/newpost', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': document.getElementById('secretKey').value
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                statusDiv.style.color = '#00ff00';
                statusDiv.innerText = 'Suksess! Innlegget ble lagret i posts.json.';
                
                // Tømmer feltene, men beholder nøkkelen så du slipper å lime den inn på nytt
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);
            } else {
                statusDiv.style.color = '#ff0000';
                statusDiv.innerText = `Feil: ${result.error || 'Kunne ikke lagre'}`;
            }
        } catch (err) {
            statusDiv.style.color = '#ff0000';
            statusDiv.innerText = `Nettverksfeil: ${err.message}`;
        }
    });
</script>

</body>
</html>
