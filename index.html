<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS - Personal website and portfolio">
    <meta name="author" content="Mats Vigestad Aune">
    <title>MATS-OS // Starthjem</title>
    <style>
        body {
            background-color: #0f0f11;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .window {
            background: #18181c;
            border: 2px solid #2e2e38;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
        }

        .title-bar {
            background: #222229;
            color: #0076ff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 13px;
            border-bottom: 2px solid #2e2e38;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #ffffff;
            margin-top: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .section-title {
            border-bottom: 1px solid #2e2e38;
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
        }

        .subpages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .page-card {
            background: #1e1e24;
            border: 1px solid #2e2e38;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
        }

        .page-card:hover {
            border-color: #0076ff;
            background: #22222b;
            transform: translateY(-3px);
        }

        .page-card h3 {
            margin: 0 0 10px 0;
            color: #0076ff;
            font-size: 18px;
        }

        .page-card p {
            margin: 0;
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="window" style="max-width: 900px;">
    <div class="title-bar">
        <span>MATS-OS // LOCAL_HOST_MANAGER</span>
        <span>[V2.1]</span>
    </div>
    <div class="content">
        <h1>MATS-OS</h1>
        
        <div class="section-title">SYSTEM_SUBPAGES (Delsider på denne serveren)</div>
        <div class="subpages-grid" id="subpagesContainer"></div>
    </div>
</div>

<script>
    const mineSider = [
        {
            "tittel": "Prosjekter",
            "url": "prosjekter.html",
            "beskrivelse": "Ting jeg har laget som sikkert aldri blir ferdig."
        },
        {
            "tittel": "Blogg",
            "url": "blogg.html",
            "beskrivelse": "Mine dype og ekstremt viktige tanker."
        },
        {
            "tittel": "Om Meg",
            "url": "om-meg.html",
            "beskrivelse": "Hvem er Mats? Svaret får du her."
        }
    ];

    const container = document.getElementById('subpagesContainer');
    
    mineSider.forEach(page => {
        const card = document.createElement('a');
        card.className = 'page-card';
        card.href = page.url;
        card.innerHTML = `
            <h3>${page.tittel}</h3>
            <p>${page.beskrivelse}</p>
        `;
        container.appendChild(card);
    });
</script>

</body>
</html>
