<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS - Personal website and portfolio">
    <meta name="author" content="Mats Vigestad Aune">
    <title>MATS-OS // Starthjem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="global-nav">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">> MATS-OS</a>
        <div class="nav-links" id="navLinks">
            <a href="prosjekter.html" class="nav-item">Prosjekter</a>
            <a href="blogg.html" class="nav-item">Blogg</a>
            <a href="om-meg.html" class="nav-item">Om Meg</a>
            <a href="spill.html" class="nav-item">Spill</a>
        </div>
    </div>
</nav>

<div class="content-wrapper">
    <div class="window" style="max-width: 900px;">
        <div class="title-bar">
            <span>MATS-OS // LOCAL_HOST_MANAGER</span>
            <span>[V2.1]</span>
        </div>
        <div class="content">
            <h1>MATS-OS</h1>
            
            <div class="section-title">SYSTEM_SUBPAGES (Delsider på denne serveren)</div>
            <div class="subpages-grid" id="subpagesContainer"></div>
        </div>
    </div>
</div>

<footer class="global-footer">
    <div class="footer-container">
        <div class="footer-section">
            <h4>System</h4>
            <p>Status: Online</p>
            <p>&copy; 2026 Mats Vigestad Aune</p>
        </div>
    </div>
</footer>

<script>
    const mineSider = [
        {
            "tittel": "Prosjekter",
            "url": "prosjekter.html",
            "beskrivelse": "Ting jeg har laget som sikkert aldri blir ferdig."
        },
        {
            "tittel": "Blogg",
            "url": "blogg.html",
            "beskrivelse": "Mine dype og ekstremt viktige tanker."
        },
        {
            "tittel": "Om Meg",
            "url": "om-meg.html",
            "beskrivelse": "Hvem er Mats? Svaret får du her."
        },
        {
            "tittel": "Spill",
            "url": "spill.html",
            "beskrivelse": "Slå i hjel litt tid her når du egentlig burde gjøre lekser."
        }
    ];

    const container = document.getElementById('subpagesContainer');
    
    mineSider.forEach(page => {
        const card = document.createElement('a');
        card.className = 'page-card';
        card.href = page.url;
        card.innerHTML = `
            <h3>${page.tittel}</h3>
            <p>${page.beskrivelse}</p>
        `;
        container.appendChild(card);
    });

    // HEMMELIG INNGANG: Hold inne "MATS-OS" i 1.5 sekunder → login
    const osTittel = document.querySelector('.content h1');
    let holdTimer;

    if (osTittel) {
        osTittel.style.userSelect = 'none';
        osTittel.style.webkitUserSelect = 'none';
        osTittel.style.cursor = 'default';

        const startHold = () => {
            holdTimer = setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        };

        const stoppHold = () => clearTimeout(holdTimer);

        osTittel.addEventListener('mousedown', startHold);
        osTittel.addEventListener('mouseup', stoppHold);
        osTittel.addEventListener('mouseleave', stoppHold);

        osTittel.addEventListener('touchstart', startHold);
        osTittel.addEventListener('touchend', stoppHold);
        osTittel.addEventListener('touchcancel', stoppHold);
    }

    // ⭐ AUTOMATISK ADMINPANEL + LOGG UT HVIS INNLOGGET
    fetch('/api/checksession', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.loggedIn) {
                const nav = document.getElementById('navLinks');

                // Adminpanel
                const adminLink = document.createElement('a');
                adminLink.href = 'adminpanel.html';
                adminLink.className = 'nav-item';
                adminLink.innerText = 'Adminpanel';
                nav.appendChild(adminLink);

                // Logg ut
                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'nav-item';
                logoutLink.innerText = 'Logg ut';
                logoutLink.addEventListener('click', async () => {
                    const res = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    const out = await res.json();
                    if (out.success) {
                        window.location.reload();
                    }
                });

                nav.appendChild(logoutLink);
            }
        });
</script>

</body>
</html>
