<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // SYSTEM_LOGIN</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Quick inline styles to keep it centered. Move to style.css if you want. */
        .login-container { max-width: 400px; margin: 100px auto; text-align: center; }
        .login-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .login-form input { padding: 10px; background: #000; border: 1px solid #00ff00; color: #00ff00; font-family: monospace; }
        .login-form button { padding: 10px; background: #00ff00; color: #000; border: none; cursor: pointer; font-weight: bold; }
        .login-form button:hover { background: #00cc00; }
        #errorMsg { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="content-wrapper login-container">
    <div class="window">
        <div class="title-bar">
            <span>MATS-OS // AUTHENTICATION</span>
        </div>
        <div class="content">
            <h2>ADMIN_LOGIN</h2>
            <form id="loginForm" class="login-form">
                <input type="text" id="user" placeholder="Brukernavn" required autocomplete="username">
                <input type="password" id="pass" placeholder="Passord" required autocomplete="current-password">
                <button type="submit">LOGG INN</button>
            </form>
            <p id="errorMsg">Feil brukernavn eller passord.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = 'adminpanel.html';
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = "Serverfeil. Prøv igjen.";
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
