<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS | Sisyfos på rad</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-color: #00ff66;
            --error: #ff6b6b;
            --surface: #111827;
            --background: #0a0e17;
            --border: #00ff66;
            --text-dim: #8892b0;
            --cell-size: 55px;
        }

        @media (max-width: 500px) {
            :root {
                --cell-size: 40px;
            }
            .content {
                padding: 15px !important;
            }
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Dynamisk snakkeboble i stedet for lang liste */
        .status-bubble {
            width: 100%;
            max-width: calc((var(--cell-size) * 7) + 80px);
            background: #05070b;
            border: 1px dashed var(--error);
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bubble-header {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .bubble-text {
            font-size: 1rem;
            line-height: 1.4;
            font-weight: bold;
        }

        .msg-sys { color: var(--text-dim); font-style: italic; }
        .msg-ai { color: var(--error); }

        .board {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-size));
            grid-gap: 6px;
            background: var(--surface);
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.1);
            touch-action: manipulation;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 50%;
            background: var(--background);
            border: 1px solid #374151;
            cursor: pointer;
        }

        .cell.player {
            background: #00ff66 !important;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 0 12px #00ff66 !important;
            border-color: #00ff66 !important;
        }

        .cell.ai {
            background: #ff6b6b !important;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 0 12px #ff6b6b !important;
            border-color: #ff6b6b !important;
        }

        .cell.deleting {
            animation: blink 0.4s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="global-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo">MATS-OS // TERMINAL</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="window">
            <div class="title-bar">
                <span>SYSTEM://4_PA_RAD.EXE</span>
                <a href="index.html" class="nav-back">[ BACK ]</a>
            </div>
            <div class="content">
                <h2>Sisyfos-utgaven</h2>
                
                <div class="game-wrapper">
                    <!-- Snakkebobla som endrer seg live -->
                    <div class="status-bubble">
                        <div class="bubble-header" id="bubble-title">Drittsekk_v2.0</div>
                        <div class="bubble-text msg-sys" id="bubble-content">System initializing...</div>
                    </div>

                    <!-- Mobilvennlig brett -->
                    <div class="board" id="board"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ROWS = 6;
        const COLS = 7;
        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        let isPlayerTurn = true;
        let isAnimating = false;

        const taunts = [
            "Ser ut som du trengte litt ryddehjelp der.",
            "Var det virkelig den beste strategien din?",
            "Du vet at du aldri kan vinne dette, sant?",
            "La meg bare sabotere den lille planen din der...",
            "Sisyfos trillet i det minste en stein. Du trykker bare på glasset."
        ];

        const boardEl = document.getElementById('board');
        const bubbleContentEl = document.getElementById('bubble-content');
        const bubbleTitleEl = document.getElementById('bubble-title');

        function initBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.addEventListener('click', () => handlePlayerMove(c));
                    boardEl.appendChild(cell);
                }
            }
            setTimeout(() => updateBubble("Klar for å kaste bort tiden din? Din tur.", "ai"), 800);
        }

        function updateBubble(msg, type = 'sys') {
            bubbleContentEl.className = `bubble-text msg-${type}`;
            if (type === 'ai') {
                bubbleTitleEl.innerText = "Drittsekk_v2.0";
                bubbleContentEl.innerText = `"${msg}"`;
            } else {
                bubbleTitleEl.innerText = "SYSTEM STATUS";
                bubbleContentEl.innerText = msg;
            }
        }

        function updateDOM() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
                    if (cell) {
                        cell.className = 'cell';
                        if (board[r][c] === 1) cell.classList.add('player');
                        if (board[r][c] === 2) cell.classList.add('ai');
                    }
                }
            }
        }

        async function dropPiece(col, player) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][col] === 0) {
                    board[r][col] = player;
                    updateDOM();
                    return true;
                }
            }
            return false;
        }

        async function handlePlayerMove(col) {
            if (!isPlayerTurn || isAnimating) return;
            isAnimating = true;
            
            const success = await dropPiece(col, 1);
            if (!success) {
                isAnimating = false;
                return;
            }

            await checkAndClear();
            isPlayerTurn = false;
            
            setTimeout(aiTurn, 600);
        }

        async function aiTurn() {
            isAnimating = true;
            
            let pieces = board.flat().filter(x => x !== 0).length;
            if (pieces > 22 && Math.random() > 0.5) {
                updateBubble("Brettet var rotete. Jeg tok en factory reset.", "ai");
                board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
                await new Promise(res => setTimeout(res, 600));
                updateDOM();
                isPlayerTurn = true;
                isAnimating = false;
                return;
            }

            let col = Math.floor(Math.random() * COLS);
            let attempts = 0;
            while (board[0][col] !== 0 && attempts < 100) {
                col = Math.floor(Math.random() * COLS);
                attempts++;
            }

            if (board[0][col] !== 0) {
                isPlayerTurn = true;
                isAnimating = false;
                return;
            }

            if (Math.random() < 0.4) {
                updateBubble(taunts[Math.floor(Math.random() * taunts.length)], "ai");
            }

            await dropPiece(col, 2);
            await checkAndClear();
            
            isPlayerTurn = true;
            isAnimating = false;
        }

        async function checkAndClear() {
            let toDelete = new Set();
            
            // Horisontal
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r][c+1] && val === board[r][c+2] && val === board[r][c+3]) {
                        [0,1,2,3].forEach(i => toDelete.add(`${r},${c+i}`));
                    }
                }
            }
            // Vertikal
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r <= ROWS - 4; r++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r+1][c] && val === board[r+2][c] && val === board[r+3][c]) {
                        [0,1,2,3].forEach(i => toDelete.add(`${r+i},${c}`));
                    }
                }
            }
            // Diagonal (ned-høyre)
            for (let r = 0; r <= ROWS - 4; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r+1][c+1] && val === board[r+2][c+2] && val === board[r+3][c+3]) {
                        [0,1,2,3].forEach(i => toDelete.add(`${r+i},${c+i}`));
                    }
                }
            }
            // Diagonal (opp-høyre)
            for (let r = 3; r < ROWS; r++) {
                for (let c = 0; c <= COLS - 4; c++) {
                    let val = board[r][c];
                    if (val !== 0 && val === board[r-1][c+1] && val === board[r-2][c+2] && val === board[r-3][c+3]) {
                        [0,1,2,3].forEach(i => toDelete.add(`${r-i},${c+i}`));
                    }
                }
            }

            if (toDelete.size > 0) {
                updateBubble("Fire på rad oppdaget. Sletter progresjon...", "sys");
                
                toDelete.forEach(coord => {
                    let [r, c] = coord.split(',');
                    const cell = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
                    if (cell) cell.classList.add('deleting');
                });

                await new Promise(res => setTimeout(res, 400));

                toDelete.forEach(coord => {
                    let [r, c] = coord.split(',');
                    board[r][c] = 0;
                });

                applyGravity();
                updateDOM();
                
                await new Promise(res => setTimeout(res, 300));
                await checkAndClear(); 
            }
        }

        function applyGravity() {
            for (let c = 0; c < COLS; c++) {
                let emptyRow = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] !== 0) {
                        let temp = board[r][c];
                        board[r][c] = 0;
                        board[emptyRow][c] = temp;
                        emptyRow--;
                    }
                }
            }
        }

        initBoard();
    </script>
</body>
</html>
