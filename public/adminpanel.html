<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Skjul siden til økten faktisk er verifisert */
        body { display: none; }
        .admin-actions { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="window" style="max-width: 650px; margin: 40px auto;">
    <div class="title-bar admin-actions">
        <span>ADMIN_PANEL // WRITE_ACCESS</span>
        <div>
            <a href="index.html" class="nav-back"><- TILBAKE</a> | 
            <a href="#" id="logoutBtn" style="color: red; text-decoration: none;">LOGG UT</a>
        </div>
    </div>
    <div class="content">
        <h1>Opprett nytt innlegg</h1>
        
        <form id="postForm">
            <div class="form-group">
                <label for="title">Tittel:</label>
                <input type="text" id="title" required placeholder="F.eks. Enda en seier over Rust-kompilatoren">
            </div>

            <div class="form-group">
                <label for="date">Dato (Tekst):</label>
                <input type="text" id="date" required>
            </div>

            <div class="form-group">
                <label for="timestamp">Timestamp:</label>
                <input type="number" id="timestamp" required>
            </div>

            <div class="form-group">
                <label for="content">Innhold:</label>
                <textarea id="content" rows="8" required placeholder="Skriv innlegget ditt her..."></textarea>
            </div>

            <button type="submit" class="admin-btn" style="width: 100%; margin-top: 15px; padding: 10px; background: #00ff00; color: #000; font-weight: bold; cursor: pointer; border: none;">PUBLISER</button>
        </form>

        <div id="status" style="margin-top: 15px; display: none; font-weight: bold;"></div>
    </div>
</div>

<script>
    // --- SIKKERHETSSJEKK ---
    fetch('/api/checksession')
        .then(res => res.json())
        .then(data => {
            if (!data.loggedIn) {
                window.location.replace("login.html"); 
            } else {
                document.body.style.display = 'block'; 
            }
        })
        .catch(() => window.location.replace("login.html"));

    // --- LOGG UT ---
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            const res = await fetch('/api/logout', { method: 'POST' });
            if ((await res.json()).success) window.location.replace("login.html");
        } catch (err) {
            console.error("Logout failed", err);
        }
    });

    // --- SKJEMA-LOGIKK ---
    const datoValg = { day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('date').value = new Date().toLocaleDateString('no-NO', datoValg);
    document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);

    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.style.color = '#fff';
        statusDiv.innerText = 'Sender forespørsel...';

        const payload = {
            title: document.getElementById('title').value,
            date: document.getElementById('date').value,
            timestamp: parseInt(document.getElementById('timestamp').value),
            content: document.getElementById('content').value
        };

        try {
            const response = await fetch('/api/newpost', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                statusDiv.style.color = '#00ff00';
                statusDiv.innerText = 'Suksess! Innlegget ble lagret i posts.json.';
                
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);
            } else {
                statusDiv.style.color = '#ff0000';
                statusDiv.innerText = `Feil: ${result.error || 'Kunne ikke lagre'}`;
            }
        } catch (err) {
            statusDiv.style.color = '#ff0000';
            statusDiv.innerText = `Nettverksfeil: ${err.message}`;
        }
    });
</script>

</body>
</html>
