<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS Blogg - Systemlogg og dype tanker">
    <meta name="author" content="Mats Vigestad Aune">
    <title>MATS-OS // Blogg</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Sørger for at body bruker hele høyden og midtstiller innholdet horisontalt */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Starter fra toppen så du kan scrolle nedover loggen */
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Litt luft i topp og bunn på mobil/PC */
            box-sizing: border-box;
        }

        /* Tvinger vinduet til å legge seg i midten med margin-trikset som backup */
        .window {
            margin: 0 auto;
            width: 100%; /* Sørger for at max-width: 800px faktisk fungerer */
        }
    </style>
</head>
<body>

<div class="window" style="max-width: 800px;">
    <div class="title-bar">
        <span>LOG_VIEWER // BLOGG</span>
        <a href="index.html" class="nav-back"><- TILBAKE</a>
    </div>
    <div class="content">
        <h1>MATS-OS Systemlogg</h1>
        
        <div class="blog-posts" id="blogPostsContainer"></div>
    </div>
</div>

<script>
    // Load blog posts from API (not directly from JSON file for security)
    fetch('/api/posts')
        .then(response => response.json())
        .then(posts => {
            const container = document.getElementById('blogPostsContainer');
            
            // Sort posts by ID in descending order (newest first)
            posts.sort((a, b) => b.id - a.id);
            
            posts.forEach(post => {
                const postCard = document.createElement('div');
                postCard.className = 'post-card';
                postCard.innerHTML = `
                    <div class="post-date">${post.timestamp}</div>
                    <h2 class="post-title">${post.title}</h2>
                    <div class="post-text">
                        ${post.content.split('\n').map(paragraph => `<p>${paragraph}</p>`).join('')}
                    </div>
                `;
                container.appendChild(postCard);
            });
        })
        .catch(error => {
            console.error('Error loading blog posts:', error);
            document.getElementById('blogPostsContainer').innerHTML = '<p style="color: #ff6b6b;">Feil ved lasting av innlegg</p>';
        });
</script>

</body>
</html>
