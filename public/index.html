<!DOCTYPE html>
<html lang="no">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS - Personal website and portfolio">
    <meta name="author" content="Mats Vigestad Aune">
    <title>MATS-OS // Starthjem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="window" style="max-width: 900px; margin: 50px auto;">
    <div class="title-bar">
        <span>MATS-OS // LOCAL_HOST_MANAGER</span>
        <span>[V2.2]</span>
    </div>

    <div class="content">
                <!-- Vinterknapp lagt til her -->
        <button id="snowToggle" style="margin-bottom: 20px;">AKTIVER VINTERMODUS ❄️</button>

        <!-- Container for dynamiske nav-lenker (Adminpanel / Logg ut) -->
        <div id="navLinks" style="margin-bottom: 20px; display: flex; gap: 10px;"></div>

        <h1>MATS-OS</h1>

        <div class="section-title">SYSTEM_SUBPAGES (Delsider på denne serveren)</div>
        <div class="subpages-grid" id="subpagesContainer"></div>
    </div>
</div>

<script>
    const mineSider = [
        {
            "tittel": "KAOS_HUB",
            "url": "spillhub.html",
            "beskrivelse": "Spill-huben. Advarer: Systemet er ustabilt."
        },
        {
            "tittel": "SirkelSpill",
            "url": "spill.html",
            "beskrivelse": "Det fete spillet med sirkler, chat og fremtidig bot-beskyttelse."
        },
        {
            "tittel": "Prosjekter",
            "url": "prosjekter.html",
            "beskrivelse": "Ting jeg har laget som sikkert aldri blir ferdig."
        },
        {
            "tittel": "Skole",
            "url": "skole.html",
            "beskrivelse": "Oversikt over mine skoleoppgaver og prosjektarbeid."
        },
        {
            "tittel": "Blogg",
            "url": "blogg.html",
            "beskrivelse": "Mine dype og ekstremt viktige tanker."
        },
        {
            "tittel": "Om Meg",
            "url": "om-meg.html",
            "beskrivelse": "Hvem er Mats? Svaret får du her."
        }
    ];

    const container = document.getElementById('subpagesContainer');

        mineSider.forEach(page => {
        const card = document.createElement('a');
        card.className = 'page-card';
        card.href = page.url;
        card.innerHTML = `
            <h3>${page.tittel}</h3>
            <p>${page.beskrivelse}</p>
        `;
        container.appendChild(card);
    });

       // SNØ-LOGIKK
    const toggleBtn = document.getElementById('snowToggle');
    const containerSnow = document.createElement('div');
    containerSnow.id = 'snow-container';
    document.body.appendChild(containerSnow);

    toggleBtn.addEventListener('click', () => {
        const isVisible = containerSnow.style.display === 'block';
        containerSnow.style.display = isVisible ? 'none' : 'block';
        toggleBtn.textContent = isVisible ? 'AKTIVER VINTERMODUS ❄️' : 'STOPP VINTERMODUS ☀️';
        
        if (!isVisible) {
            // Økt frekvens fra 200 til 50
            const snowInterval = setInterval(() => {
                if (containerSnow.style.display === 'none') return clearInterval(snowInterval);

                const snow = document.createElement('div');
                snow.className = 'snowflake';
                // Gjør snøfnuggene større (8px - 12px)
                const size = Math.random() * 4 + 8 + 'px';
                snow.style.width = size;
                snow.style.height = size;
                
                const startLeft = Math.random() * 100;
                snow.style.left = startLeft + 'vw';
                snow.style.top = '-20px';
                containerSnow.appendChild(snow);

                let targetY = window.innerHeight;
                const elements = document.querySelectorAll('.window, .nav-item, h1, .page-card');
                elements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (startLeft > (rect.left / window.innerWidth * 100) && 
                        startLeft < (rect.right / window.innerWidth * 100) &&
                        rect.top > 0) { // Kun hvis elementet er synlig
                        targetY = Math.min(targetY, rect.top + window.scrollY);
                    }
                });

                snow.animate([
                    { top: '-20px' },
                    { top: (targetY - 10) + 'px' }
                ], {
                    duration: 2000 + Math.random() * 1000,
                    easing: 'linear',
                    fill: 'forwards'
                }).onfinish = () => {
                    snow.className = 'snow-pile';
                };
            }, 50); // Mye mer snø
        }
    });
    // AUTOMATISK ADMINPANEL + LOGG UT HVIS INNLOGGET
    fetch('/api/checksession', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.loggedIn) {
                const nav = document.getElementById('navLinks');

                // Adminpanel
                const adminLink = document.createElement('a');
                adminLink.href = 'adminpanel.html';
                adminLink.className = 'nav-item';
                adminLink.innerText = 'Adminpanel';
                nav.appendChild(adminLink);

                // Logg ut
                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'nav-item';
                logoutLink.innerText = 'Logg ut';
                
                // Fikset: Stopper jojo-scrolling til toppen av siden
                logoutLink.addEventListener('click', async (e) => {
                    e.preventDefault(); 
                    
                    const res = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    const out = await res.json();
                    if (out.success) {
                        window.location.reload();
                    }
                });

                nav.appendChild(logoutLink);
            }
            const title = document.querySelector('h1');
let timer;

const startHold = () => {
    timer = setTimeout(() => {
        window.location.href = 'adminpanel.html';
    }, 1500); // 1.5 sekunder
};

const cancelHold = () => clearTimeout(timer);

// Både mus og touch for mobil
title.addEventListener('mousedown', startHold);
title.addEventListener('touchstart', startHold);

title.addEventListener('mouseup', cancelHold);
title.addEventListener('mouseleave', cancelHold);
title.addEventListener('touchend', cancelHold);

        });
</script>

</body>
</html>
