<!DOCTYPE html>
<html lang="no">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS - Personal website and portfolio">
    <meta name="author" content="Mats Vigestad Aune">
    <title>MATS-OS // Starthjem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="window" style="max-width: 900px; margin: 50px auto;">
    <div class="title-bar">
        <span>MATS-OS // LOCAL_HOST_MANAGER</span>
        <span>[V2.2]</span>
    </div>

    <div class="content">
                <!-- Vinterknapp lagt til her -->
        <button id="snowToggle" style="margin-bottom: 20px;">AKTIVER VINTERMODUS ❄️</button>

        <!-- Container for dynamiske nav-lenker (Adminpanel / Logg ut) -->
        <div id="navLinks" style="margin-bottom: 20px; display: flex; gap: 10px;"></div>

        <h1>MATS-OS</h1>

        <h2 class="section-title">SYSTEM_SUBPAGES (Delsider på denne serveren)</h2>
        <div class="subpages-grid" id="subpagesContainer"></div>
    </div>
</main>

<script>
    const mineSider = [
        {
            "tittel": "KAOS_HUB",
            "url": "spillhub.html",
            "beskrivelse": "Spill-huben. Advarer: Systemet er ustabilt."
        },
        {
            "tittel": "SirkelSpill",
            "url": "spill.html",
            "beskrivelse": "Det fete spillet med sirkler, chat og fremtidig bot-beskyttelse."
        },
        {
            "tittel": "Prosjekter",
            "url": "prosjekter.html",
            "beskrivelse": "Ting jeg har laget som sikkert aldri blir ferdig."
        },
        {
            "tittel": "Skole",
            "url": "skole.html",
            "beskrivelse": "Oversikt over mine skoleoppgaver og prosjektarbeid."
        },
        {
            "tittel": "Blogg",
            "url": "blogg.html",
            "beskrivelse": "Mine dype og ekstremt viktige tanker."
        },
        {
            "tittel": "Om Meg",
            "url": "om-meg.html",
            "beskrivelse": "Hvem er Mats? Svaret får du her."
        }
    ];

    const container = document.getElementById('subpagesContainer');

        mineSider.forEach(page => {
        const card = document.createElement('a');
        card.className = 'page-card';
        card.href = page.url;
        // Semantic: h3 inside an anchor tag is fine, but ensure the heading level hierarchy holds.
        // The container is an h2, so an h3 for each card is correct.
        card.innerHTML = `
            <h3 class="page-card-title">${page.tittel}</h3>
            <p>${page.beskrivelse}</p>
        `;
        container.appendChild(card);
    });

                            // SNØ-LOGIKK
              const toggleBtn = document.getElementById('snowToggle');
              const containerSnow = document.createElement('div');
              containerSnow.id = 'snow-container';
              document.body.appendChild(containerSnow);

              // Hukommelse for hvor mye snø som ligger på hvert x-punkt
              let pileHeights = {}; 
              const FALL_SPEED = 100; // Piksler per sekund (høyere = raskere)

                            // KOST-LOGIKK: Dytter bort snø i nærheten av musa
              document.addEventListener('mousemove', (e) => {
                  if (containerSnow.style.display !== 'block') return;

                  const mouseX = e.clientX;
                  const mouseY = e.clientY;
                  const brushRadius = 100; // Økt radius for bedre "kost"-effekt

                  const piles = containerSnow.querySelectorAll('.snow-pile:not(.falling)');
                  piles.forEach(snow => {
                      const rect = snow.getBoundingClientRect();
                      const dx = mouseX - (rect.left + rect.width / 2);
                      const dy = mouseY - (rect.top + rect.height / 2);
                      
                      // Bruker kvadratet av distansen for raskere beregning
                      if (dx * dx + dy * dy < brushRadius * brushRadius) {
                          snow.classList.add('falling');
                          // Finn X-posisjon i piksler for å fjerne fra høyden
                          const xPos = Math.round(parseFloat(snow.style.left) / 10) * 10;
                          if (pileHeights[xPos]) {
                              pileHeights[xPos] = Math.max(0, pileHeights[xPos] - 0.5);
                          }
                          setTimeout(() => snow.remove(), 1500);
                      }
                  });
              });

              toggleBtn.addEventListener('click', () => {
                  const isVisible = containerSnow.style.display === 'block';
                  containerSnow.style.display = isVisible ? 'none' : 'block';
                  toggleBtn.textContent = isVisible ? 'AKTIVER VINTERMODUS ❄️' : 'STOPP VINTERMODUS ☀️';
        
                  if (!isVisible) {
                      const snowInterval = setInterval(() => {
                          if (containerSnow.style.display === 'none') return clearInterval(snowInterval);

                                                    // Helt tilfeldig X, men rundet til nærmeste 10px for å "fokusere" haugene
                          const xPos = Math.round((Math.random() * window.innerWidth) / 10) * 10;
                          if (!pileHeights[xPos]) pileHeights[xPos] = 0;
                
                                                    // Finn grunnlag
                          let groundY = window.innerHeight;
                          // Inkluderer alle mulige containere som er store nok
                          const groundElements = document.querySelectorAll('main, div, footer, section, .window, .subpages-grid, .page-card, .content');
                          
                          groundElements.forEach(el => {
                              const rect = el.getBoundingClientRect();
                              // Vi ser etter elementer som er store nok til å være "bakker"
                              // 50% sjanse for at snøen "ser" elementet, ellers faller den gjennom
                              if (rect.height > 50 && xPos >= rect.left && xPos <= rect.right && rect.top > 0 && Math.random() > 0.5) {
                                  groundY = Math.min(groundY, rect.top + window.scrollY);
                              }
                          });

                          // Målet er bakken minus høyden på snøen som allerede ligger der
                          const targetY = groundY - pileHeights[xPos] - 5;
                          const duration = ((targetY + 20) / FALL_SPEED) * 1000;

                          const snow = document.createElement('div');
                          snow.className = 'snowflake';
                          const size = (Math.random() * 6 + 6) + 'px';
                          snow.style.width = size;
                          snow.style.height = size;
                          snow.style.left = xPos + 'px';
                
                          containerSnow.appendChild(snow);

                                                    snow.animate([
                              { top: '-20px' },
                              { top: targetY + 'px' }
                          ], {
                              duration: duration,
                              easing: 'linear',
                              fill: 'forwards'
                                                    }).onfinish = () => {
                                                        snow.className = 'snow-pile';
                                                        snow.style.pointerEvents = 'auto'; 
                                                        pileHeights[xPos] += 0.5;
                                                    };
                      }, 50); // 50ms = 20 snøfnugg i sekundet!
                  }
              });
    // AUTOMATISK ADMINPANEL + LOGG UT HVIS INNLOGGET
    fetch('/api/checksession', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
            if (data.loggedIn) {
                const nav = document.getElementById('navLinks');

                // Adminpanel
                const adminLink = document.createElement('a');
                adminLink.href = 'adminpanel.html';
                adminLink.className = 'nav-item';
                adminLink.innerText = 'Adminpanel';
                nav.appendChild(adminLink);

                // Logg ut
                const logoutLink = document.createElement('a');
                logoutLink.href = '#';
                logoutLink.className = 'nav-item';
                logoutLink.innerText = 'Logg ut';
                
                // Fikset: Stopper jojo-scrolling til toppen av siden
                logoutLink.addEventListener('click', async (e) => {
                    e.preventDefault(); 
                    
                    const res = await fetch('/api/logout', {
                        method: 'POST',
                        credentials: 'include'
                    });

                    const out = await res.json();
                    if (out.success) {
                        window.location.reload();
                    }
                });

                nav.appendChild(logoutLink);
            }
            const title = document.querySelector('h1');
let timer;

const startHold = () => {
    timer = setTimeout(() => {
        window.location.href = 'adminpanel.html';
    }, 1500); // 1.5 sekunder
};

const cancelHold = () => clearTimeout(timer);

// Både mus og touch for mobil
title.addEventListener('mousedown', startHold);
title.addEventListener('touchstart', startHold);

title.addEventListener('mouseup', cancelHold);
title.addEventListener('mouseleave', cancelHold);
title.addEventListener('touchend', cancelHold);

        });
</script>

</body>
</html>
