<!DOCTYPE html>
<html lang="no">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // SYSTEM_LOGIN</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Quick inline styles to keep it centered. Move to style.css if you want. */
        .login-container { max-width: 400px; margin: 100px auto; text-align: center; }
        .login-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .login-form input { padding: 10px; background: #ffffff; border: 1px solid #deffd1; color: #deffd1; font-family: monospace; }
        .login-form button { padding: 10px; background: #deffd1; color: #ffffff; border: none; cursor: pointer; font-weight: bold; }
        .login-form button:hover { background: #e6ffdd; }
        #errorMsg { color: #deffd1; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="content-wrapper login-container">
    <div class="window">
        <div class="title-bar">
            <span>MATS-OS // AUTHENTICATION</span>
        </div>
        <div class="content">
            <h2>ADMIN_LOGIN</h2>
            <form id="loginForm" class="login-form">
                <input type="text" id="user" placeholder="Brukernavn" required autocomplete="username">
                <input type="password" id="pass" placeholder="Passord" required autocomplete="current-password">
                <button type="submit">LOGG INN</button>
            </form>
            <p id="errorMsg">Feil brukernavn eller passord.</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = 'adminpanel.html';
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            errorMsg.innerText = "Serverfeil. Prøv igjen.";
            errorMsg.style.display = 'block';
        }
    });
</script>
<div id="mats-aura-banner" role="status" style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;background:#deffd1;color:#ffffff;border-top:2px solid #ffffff;font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:bold;letter-spacing:1px;text-align:center;box-shadow:0 -4px 12px rgba(222, 255, 209, 0.8);">
    <span>JEG VIBE KODET DETTE!!! DET ER POSITIV AURA</span>
    <span>city: mork/egset</span>
</div>
<style>body { padding-bottom: 64px; }</style>


</body>
</html>
