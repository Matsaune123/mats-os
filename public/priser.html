<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priser – Solstua Frisør</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/priser.js" defer></script>
  </head>
  <body>
    <header>
      <p>Solstua Frisør</p>
      <nav>
        <a href="index.html">Tilbake til forsiden</a>
      </nav>
    </header>

    <main>
      <h1>Priser</h1>

      <section>
        <h2>Prisliste</h2>
        <ul>
          <li>Dameklipp: 650 kr</li>
          <li>Herreklipp: 450 kr</li>
          <li>Barneklipp: 300 kr</li>

        <p>Dameklipp med vask: <span id="price-with-wash"></span> kr</p>

      <section>
        <h2>Gruppebestilling</h2>
        <p>Dameklipp med vask for gruppen: <span id="group-total"></span> kr</p>
        <p id="group-discount"></p>
      </section>
    </main>

    <footer>
      <p>Solstua Frisør · Storgata 14 · 1234 Bygdeby</p>
    </footer>
