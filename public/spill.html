<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // SirkelSpill</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 10px; }
        canvas { background: #111; border: 2px solid #444; display: block; margin: 10px auto; max-width: 100%; height: auto; }
        #chat-box { max-width: 800px; width: 95%; margin: 10px auto; text-align: left; }
        #chat { height: 120px; background: #333; overflow-y: scroll; padding: 10px; border-radius: 4px; margin-bottom: 5px; font-size: 14px; }
        .input-row { display: flex; gap: 5px; }
        #chatInput { flex: 1; padding: 8px; border: none; border-radius: 4px; }
        #sendBtn { width: 80px; padding: 8px; background: #0076ff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .mobile-toggle { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin: 5px; }
        .mobile-toggle.active { background: #0076ff; }
        .dpad-container { display: none; flex-direction: column; align-items: center; gap: 5px; margin: 15px auto; user-select: none; }
        .dpad-row { display: flex; gap: 45px; }
        .dpad-btn { width: 60px; height: 60px; background: rgba(0, 118, 255, 0.2); border: 2px solid #0076ff; color: #fff; border-radius: 50%; outline: none; }
        .dpad-btn:active { background: #0076ff; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        #login-screen input[type="text"] { padding: 12px; font-size: 16px; border-radius: 4px; border: none; width: 250px; margin-bottom: 15px; text-align: center; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 16px; color: #aaa; }
        #colorInput { width: 50px; height: 40px; border: none; background: none; cursor: pointer; padding: 0; }
        #login-screen button { padding: 12px 24px; font-size: 16px; background: #0076ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>MATS-OS SirkelSpill</h2>
        <input type="text" id="nameInput" placeholder="Navn..." maxlength="15">
        <div class="color-picker-wrapper">
            <label for="colorInput">Velg farge:</label>
            <input type="color" id="colorInput" value="#0076ff">
        </div>
        <button id="joinBtn">Bli med</button>
    </div>

    <div id="game-container" class="hidden">
        <button id="toggleMobile" class="mobile-toggle">Mobilkontroller: AV</button>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="mobileDpad" class="dpad-container">
            <button id="btnUp" class="dpad-btn">▲</button>
            <div class="dpad-row">
                <button id="btnLeft" class="dpad-btn">◀</button>
                <button id="btnDown" class="dpad-btn">▼</button>
                <button id="btnRight" class="dpad-btn">▶</button>
            </div>
        </div>

        <div id="chat-box">
            <div id="chat"></div>
            <div class="input-row">
                <input type="text" id="chatInput" placeholder="Melding...">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const chat = document.getElementById('chat');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${window.location.host}/ws/`);

        let players = {};
        let render = {};
        let myName = 'Anonym';
        let myColor = '#0076ff';
        let myPlayerId = null;
        const speed = 5;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        const movementKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

        const cookies = document.cookie.split('; ');
        const savedName = cookies.find(row => row.startsWith('mats_player_name='));
        const savedColor = cookies.find(row => row.startsWith('mats_player_color='));

        if (savedName) document.getElementById('nameInput').value = decodeURIComponent(savedName.split('=')[1]);
        if (savedColor) document.getElementById('colorInput').value = decodeURIComponent(savedColor.split('=')[1]);

        function sendMessage(payload) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(payload));
            }
        }

        document.getElementById('joinBtn').onclick = () => {
            myName = document.getElementById('nameInput').value || 'Anonymous';
            myColor = document.getElementById('colorInput').value;

            document.cookie = `mats_player_name=${encodeURIComponent(myName)}; max-age=${60*60*24*30}; path=/`;
            document.cookie = `mats_player_color=${encodeURIComponent(myColor)}; max-age=${60*60*24*30}; path=/`;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');

            sendMessage({
                type: 'join',
                x: 400,
                y: 250,
                name: myName,
                color: myColor
            });
        };

        window.addEventListener('keydown', (e) => {
            if (movementKeys.includes(e.key)) e.preventDefault();
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (movementKeys.includes(e.key)) e.preventDefault();
            keys[e.key] = false;
        });

        function lerp(s, e, a) { return (1 - a) * s + a * e; }

        function update() {
            if (!myPlayerId || !players[myPlayerId]) return;

            const current = players[myPlayerId];
            let moved = false;
            let nextX = current.x;
            let nextY = current.y;

            if (keys.ArrowUp) { nextY -= speed; moved = true; }
            if (keys.ArrowDown) { nextY += speed; moved = true; }
            if (keys.ArrowLeft) { nextX -= speed; moved = true; }
            if (keys.ArrowRight) { nextX += speed; moved = true; }

            if (moved) {
                nextX = Math.max(20, Math.min(780, nextX));
                nextY = Math.max(20, Math.min(480, nextY));
                current.x = nextX;
                current.y = nextY;
                sendMessage({ type: 'movement', x: nextX, y: nextY, name: myName, color: myColor });
            }
        }

        document.getElementById('toggleMobile').onclick = (e) => {
            const d = document.getElementById('mobileDpad');
            d.style.display = d.style.display === 'flex' ? 'none' : 'flex';
            e.target.classList.toggle('active');
        };

        let moveInt;
        function startMove(dx, dy) {
            clearInterval(moveInt);
            moveInt = setInterval(() => {
                if (!myPlayerId || !players[myPlayerId]) return;
                const current = players[myPlayerId];
                const nextX = Math.max(20, Math.min(780, current.x + dx));
                const nextY = Math.max(20, Math.min(480, current.y + dy));
                current.x = nextX;
                current.y = nextY;
                sendMessage({ type: 'movement', x: nextX, y: nextY, name: myName, color: myColor });
            }, 30);
        }

        const buttons = { btnUp: [0, -speed], btnDown: [0, speed], btnLeft: [-speed, 0], btnRight: [speed, 0] };
        Object.keys(buttons).forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            const [dx, dy] = buttons[id];
            el.addEventListener('touchstart', (e) => { e.preventDefault(); startMove(dx, dy); }, { passive: false });
            el.addEventListener('mousedown', () => startMove(dx, dy));
        });

        document.querySelectorAll('.dpad-btn').forEach(b => {
            const stop = () => clearInterval(moveInt);
            b.addEventListener('touchend', stop);
            b.addEventListener('mouseup', stop);
            b.addEventListener('mouseleave', stop);
        });

        sendBtn.onclick = () => {
            if (chatInput.value.trim()) {
                sendMessage({ type: 'chatMessage', msg: chatInput.value.trim() });
                chatInput.value = '';
            }
        };

        socket.addEventListener('message', (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === 'init') {
                    myPlayerId = data.id;
                    return;
                }

                if (data.type === 'currentPlayers') {
                    players = data.players;
                    return;
                }

                if (data.type === 'playerDisconnected') {
                    delete players[data.id];
                    delete render[data.id];
                    return;
                }

                if (data.type === 'chatMessage') {
                    const msgDiv = document.createElement('div');
                    const boldName = document.createElement('b');
                    const author = players[data.id]?.name || '?';

                    boldName.textContent = `${author}: `;
                    msgDiv.appendChild(boldName);
                    msgDiv.appendChild(document.createTextNode(data.msg));

                    chat.appendChild(msgDiv);
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (e) {
                // Håndterer ugyldig JSON uten å krasje
            }
        });

        function draw() {
            ctx.clearRect(0, 0, 800, 500);

            for (const id in players) {
                const player = players[id];
                if (!render[id]) {
                    render[id] = { x: player.x, y: player.y };
                }

                render[id].x = lerp(render[id].x, player.x, 0.2);
                render[id].y = lerp(render[id].y, player.y, 0.2);

                ctx.beginPath();
                ctx.arc(render[id].x, render[id].y, 20, 0, Math.PI * 2);
                ctx.fillStyle = player.color || '#0076ff';
                ctx.fill();

                if (id === myPlayerId) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                ctx.fillStyle = '#fff';
                ctx.fillText(player.name || 'Anonym', render[id].x - 15, render[id].y - 28);
            }

            requestAnimationFrame(draw);
        }

        setInterval(update, 30);
        draw();
    </script>
</body>
</html>
