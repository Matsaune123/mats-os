<!DOCTYPE html>
<html lang="no">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MATS-OS sikkerhetskontroll: Bekreft din identitet for å fortsette.">
    <title>Sikkerhetskontroll - MATS-OS</title>
    <link rel="stylesheet" href="css/style.css"> 
    <script src="js/spill_captcha.js" defer></script>
</head>
<body>

    <!-- GLOBAL NAVIGATION -->
    <nav class="global-nav">
        <div class="nav-container">
            <a href="#" class="nav-logo">[MATS-OS]</a>
            <div class="nav-links">
                <a href="#" class="nav-item">Hjem</a>
                <a href="#" class="nav-item">Prosjekter</a>
                <a href="#" class="nav-item">Blogg</a>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="content-wrapper">
        <div class="window" id="captcha-app">
            <div class="title-bar">
                <span>SECURITY-CAPTCHA.SYS v0.9b</span>
                <span class="nav-back">[X]</span>
            </div>
            
            <div class="content">
                <h1>BEKREFT_IDENTITET</h1>
                <p>Systemet krever manuell validering før tilgang gis. Velg alle ruter som inneholder <strong style="color: var(--error);">FEILFRI KODE</strong>.</p>

                <!-- Bruker status-block som en ramme for CAPTCHAen -->
                <div class="status-block" style="max-width: 400px; padding: 20px; background: var(--background);">
                    
                    <div id="captcha-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;">
                        <!-- Ruter genereres med JS -->
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="error-msg" style="color: var(--error); font-size: 13px; font-weight: bold; visibility: hidden; font-family: monospace;">BOT OPPDAGET.</span>
                        <!-- Bruker din admin-btn klasse -->
                        <button class="admin-btn" id="verify-btn" style="width: auto; margin-top: 0; padding: 10px 30px;">BEKREFT</button>
                    </div>

                </div>
                
                <div id="status" style="display: block; max-width: 400px;">Status: Venter på brukerinndata...</div>
            </div>
        </div>
    </main>

    <!-- GLOBAL FOOTER -->
    <footer class="global-footer">
        <div class="footer-container">
            <div class="footer-section">
                <span class="footer-title">MATS-OS</span>
                <p>Nostalgi satt i system.</p>
            </div>
            <div class="footer-section">
                <span class="footer-title">Systemstatus</span>
                <p>Ingen slipper unna.</p>
            </div>
        </div>
    </footer>

    
</body>
</html>
