<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>MATS-OS // KURSOR_FLUKT.TOUCHPAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="content-wrapper">
    <div class="window">
        <div class="title-bar">
            <span>MODUS: KURSOR_FLUKT.TOUCHPAD</span>
            <a href="kaos.html" class="nav-back">[ EXIT ]</a>
        </div>

        <div class="content">
            <p id="status" style="display: block;">Status: Aktiver virtuell mus for å starte.</p>

            <div class="form-group">
                <label>Aktiver virtuell mus (Bruk 2 fingre for klikk):</label>
                <input type="checkbox" id="vmToggle">
            </div>

            <div class="game-viewport" id="viewport" style="height: 400px; border: 1px dashed var(--border); position: relative; overflow: hidden;">
                <div class="virtual-cursor" id="vCursor"></div>
                <button id="runawayBtn" style="position: absolute; top: 0; left: 0; padding: 10px; background: var(--primary-color); border: none; cursor: pointer; color: var(--background); font-weight: bold; will-change: transform;">KLIKK_MEG.EXE</button>
            </div>
        </div>
    </div>
</div>
<script>
const vp = document.getElementById('viewport');
const btn = document.getElementById('runawayBtn');
const status = document.getElementById('status');
const vCursor = document.getElementById('vCursor');
const vmToggle = document.getElementById('vmToggle');

const isTouchDevice =
    'ontouchstart' in window ||
    navigator.maxTouchPoints > 0;

let cursorX = 150;
let cursorY = 150;

let mouseX = 150;
let mouseY = 150;

let lastTouchX = null;
let lastTouchY = null;

let btnX = 180;
let btnY = 180;

btn.style.transform = `translate(${btnX}px, ${btnY}px)`;

// SKJUL TOUCH-GREIER PÅ PC
if (!isTouchDevice) {
    vmToggle.parentElement.style.display = 'none';
    vCursor.style.display = 'none';
    status.innerText = 'Status: PC_MODUS AKTIV.';
} else {
    vmToggle.checked = true;
    status.innerText = 'Status: TOUCH_MODUS AKTIV.';
}

// TEGN VIRTUELL MUS KUN PÅ TOUCH
function updateCursor() {
    if (isTouchDevice) {
        vCursor.style.transform =
            `translate(${cursorX}px, ${cursorY}px)`;
    }

    requestAnimationFrame(updateCursor);
}

updateCursor();

function checkClick() {
    const cX = isTouchDevice ? cursorX + 10 : mouseX;
    const cY = isTouchDevice ? cursorY + 10 : mouseY;

    if (
        cX >= btnX &&
        cX <= btnX + btn.offsetWidth &&
        cY >= btnY &&
        cY <= btnY + btn.offsetHeight
    ) {
        alert("SYSTEM_FEIL: Du klikka på knappen.");
        location.reload();
    }
}

// TOUCH
if (isTouchDevice) {

    vp.addEventListener('touchstart', (e) => {
        e.preventDefault();

        if (e.touches.length > 1) {
            checkClick();
        }

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }, { passive: false });

    vp.addEventListener('touchmove', (e) => {
        e.preventDefault();

        const t = e.touches[0];

        cursorX += t.clientX - lastTouchX;
        cursorY += t.clientY - lastTouchY;

        cursorX = Math.max(
            0,
            Math.min(cursorX, vp.clientWidth - 20)
        );

        cursorY = Math.max(
            0,
            Math.min(cursorY, vp.clientHeight - 20)
        );

        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
    }, { passive: false });

}

// PC
else {

    vp.addEventListener('mousemove', (e) => {
        const rect = vp.getBoundingClientRect();

        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    btn.addEventListener('click', () => {
        alert("SYSTEM_FEIL: Du klikka på knappen.");
        location.reload();
    });

}

function gameLoop() {

    let pointerX;
    let pointerY;

    if (isTouchDevice) {
        pointerX = cursorX + 10;
        pointerY = cursorY + 10;
    } else {
        pointerX = mouseX;
        pointerY = mouseY;
    }

    const centerX = btnX + btn.offsetWidth / 2;
    const centerY = btnY + btn.offsetHeight / 2;

    const diffX = pointerX - centerX;
    const diffY = pointerY - centerY;

    const dist = Math.sqrt(diffX * diffX + diffY * diffY);

    if (dist < 100) {

        status.innerText = "Status: MANIPULERER_KURSOR...";

        let moveStep = 25;

        let nextX =
            btnX - (diffX / dist) * moveStep;

        let nextY =
            btnY - (diffY / dist) * moveStep;

        const maxX =
            vp.clientWidth - btn.offsetWidth;

        const maxY =
            vp.clientHeight - btn.offsetHeight;

        nextX = Math.max(0, Math.min(nextX, maxX));
        nextY = Math.max(0, Math.min(nextY, maxY));

        btnX = nextX;
        btnY = nextY;

        btn.style.transform =
            `translate(${btnX}px, ${btnY}px)`;

    } else {

        status.innerText =
            isTouchDevice
                ? "Status: TOUCH_MODUS AKTIV."
                : "Status: PC_MODUS AKTIV.";

    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
