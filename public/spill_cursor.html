<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>MATS-OS // KURSOR_FLUKT.TOUCHPAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="content-wrapper">
    <div class="window">
        <div class="title-bar">
            <span>MODUS: KURSOR_FLUKT.TOUCHPAD</span>
            <a href="kaos.html" class="nav-back">[ EXIT ]</a>
        </div>

        <div class="content">
            <p id="status" style="display: block;">Status: Aktiver virtuell mus for å starte.</p>

            <div class="form-group">
                <label>Aktiver virtuell mus (Bruk 2 fingre for klikk):</label>
                <input type="checkbox" id="vmToggle">
            </div>

            <div class="game-viewport" id="viewport" style="height: 400px; border: 1px dashed var(--border); position: relative; overflow: hidden;">
                <div class="virtual-cursor" id="vCursor"></div>
                <button id="runawayBtn" style="position: absolute; padding: 10px; background: var(--primary-color); border: none; cursor: pointer; color: var(--background); font-weight: bold;">KLIKK_MEG.EXE</button>
            </div>
        </div>
    </div>
</div>

<script>
    const vp = document.getElementById('viewport');
    const btn = document.getElementById('runawayBtn');
    const status = document.getElementById('status');
    const vCursor = document.getElementById('vCursor');
    const vmToggle = document.getElementById('vmToggle');

    let cursorX = 150, cursorY = 150;
    let lastTouchX = null, lastTouchY = null;

    btn.style.left = "180px";
    btn.style.top = "180px";

    function updateCursor() {
        vCursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        requestAnimationFrame(updateCursor);
    }
    updateCursor();

    vmToggle.addEventListener('change', () => {
        document.documentElement.classList.toggle('noscroll', vmToggle.checked);
    });

    vp.addEventListener('touchstart', (e) => {
        if (!vmToggle.checked) return;
        e.preventDefault();
        
        if (e.touches.length > 1) {
            checkClick();
        }

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }, { passive: false });

    vp.addEventListener('touchmove', (e) => {
        if (!vmToggle.checked) return;
        e.preventDefault();

        const t = e.touches[0];
        cursorX += (t.clientX - lastTouchX);
        cursorY += (t.clientY - lastTouchY);

        cursorX = Math.max(0, Math.min(cursorX, vp.clientWidth - 20));
        cursorY = Math.max(0, Math.min(cursorY, vp.clientHeight - 20));

        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
    }, { passive: false });

    function checkClick() {
        const bX = btn.offsetLeft;
        const bY = btn.offsetTop;
        
        if (cursorX >= bX && cursorX <= (bX + btn.offsetWidth) && 
            cursorY >= bY && cursorY <= (bY + btn.offsetHeight)) {
            alert("SYSTEM_FEIL: Du klikka med virtuell touchpad-mus. Respekt.");
            location.reload();
        }
    }

    function gameLoop() {
        if (vmToggle.checked) {
            const btnX = btn.offsetLeft;
            const btnY = btn.offsetTop;
            const centerX = btnX + (btn.offsetWidth / 2);
            const centerY = btnY + (btn.offsetHeight / 2);

            const diffX = cursorX - centerX;
            const diffY = cursorY - centerY;
            const dist = Math.sqrt(diffX**2 + diffY**2);

            if (dist < 100) {
                status.innerText = "Status: MANIPULERER_KURSOR...";
                
                let moveStep = 25;
                let nextX = btnX - (diffX / dist) * moveStep;
                let nextY = btnY - (diffY / dist) * moveStep;

                const maxX = vp.clientWidth - btn.offsetWidth;
                const maxY = vp.clientHeight - btn.offsetHeight;

                if (nextX <= 0 || nextX >= maxX) {
                    nextX = Math.max(0, Math.min(nextX, maxX));
                    nextY += (diffY > 0 ? -moveStep : moveStep);
                }
                if (nextY <= 0 || nextY >= maxY) {
                    nextY = Math.max(0, Math.min(nextY, maxY));
                    nextX += (diffX > 0 ? -moveStep : moveStep);
                }

                btn.style.left = Math.max(0, Math.min(nextX, maxX)) + 'px';
                btn.style.top = Math.max(0, Math.min(nextY, maxY)) + 'px';
            } else {
                status.innerText = "Status: KURSOR_AKTIV.";
            }
        }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
