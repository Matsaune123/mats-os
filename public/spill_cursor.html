<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>MATS-OS // KURSOR_FLUKT.TOUCHPAD</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="content-wrapper">
    <div class="window">

        <div class="title-bar">
            <span>MODUS: KURSOR_FLUKT.TOUCHPAD</span>
            <a href="kaos.html" class="nav-back">[ EXIT ]</a>
        </div>

        <div class="content">
            <h1>KURSOR_FLUKT — Touchpad Edition</h1>

            <p id="status">Status: Aktiver virtuell mus for å starte.</p>

            <div class="form-group">
                <label>Aktiver virtuell mus:</label>
                <input type="checkbox" id="vmToggle">
            </div>

            <div class="game-viewport" id="viewport">
                <div class="virtual-cursor" id="vCursor"></div>
                <button id="runawayBtn">KLIKK_MEG.EXE</button>
            </div>
        </div>

    </div>
</div>

<script>
    const vp = document.getElementById('viewport');
    const btn = document.getElementById('runawayBtn');
    const status = document.getElementById('status');
    const vCursor = document.getElementById('vCursor');
    const vmToggle = document.getElementById('vmToggle');

    // Startposisjon for knappen
    const startPos = window.innerWidth < 600 ? 120 : 180;
    btn.style.top = startPos + "px";
    btn.style.left = startPos + "px";

    let cursorX = 150;
    let cursorY = 150;

    let lastTouchX = null;
    let lastTouchY = null;

    // Smooth virtuell cursor
    function updateCursor() {
        vCursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        requestAnimationFrame(updateCursor);
    }
    updateCursor();

    // FULL GLOBAL SCROLL-LOCK
    vmToggle.addEventListener('change', () => {
        if (vmToggle.checked) {
            document.documentElement.classList.add('noscroll');
            document.body.classList.add('noscroll');
        } else {
            document.documentElement.classList.remove('noscroll');
            document.body.classList.remove('noscroll');
        }
    });

    // Hindre ALL scrolling når virtuell mus er aktiv
    document.addEventListener('touchmove', (e) => {
        if (vmToggle.checked) {
            e.preventDefault();
        }
    }, { passive: false });

    // TOUCHPAD-STYRING (TeamViewer-style)
    vp.addEventListener('touchstart', (e) => {
        if (!vmToggle.checked) return;
        e.preventDefault();

        const t = e.touches[0];
        lastTouchX = t.clientX;
        lastTouchY = t.clientY;
    }, { passive: false });

    vp.addEventListener('touchmove', (e) => {
        if (!vmToggle.checked) return;
        e.preventDefault();

        const t = e.touches[0];

        const deltaX = t.clientX - lastTouchX;
        const deltaY = t.clientY - lastTouchY;

        lastTouchX = t.clientX;
        lastTouchY = t.clientY;

        // Flytt virtuell cursor relativt (touchpad-style)
        cursorX += deltaX;
        cursorY += deltaY;

        // Hold musa innenfor viewport
        const rect = vp.getBoundingClientRect();
        cursorX = Math.max(0, Math.min(cursorX, rect.width));
        cursorY = Math.max(0, Math.min(cursorY, rect.height));
    }, { passive: false });

    // Ekte mus er deaktivert
    vp.addEventListener('mousemove', () => {});

    // Spilllogikk
    function gameLoop() {
        if (!vmToggle.checked) {
            status.innerText = "Status: Aktiver virtuell mus for å starte.";
            requestAnimationFrame(gameLoop);
            return;
        }

        const vpRect = vp.getBoundingClientRect();
        const btnTop = parseInt(btn.style.top);
        const btnLeft = parseInt(btn.style.left);

        const diffX = cursorX - (btnLeft + 60);
        const diffY = cursorY - (btnTop + 20);
        const dist = Math.sqrt(diffX * diffX + diffY * diffY);

        const fleeRadius = window.innerWidth < 600 ? 140 : 100;

        if (dist < fleeRadius) {
            status.innerText = "Status: MANIPULERER_KURSOR...";

            let moveX = (diffX / dist) * 40;
            let moveY = (diffY / dist) * 40;

            let newLeft = btnLeft - moveX;
            let newTop = btnTop - moveY;

            newLeft = Math.max(0, Math.min(newLeft, vpRect.width - 120));
            newTop = Math.max(0, Math.min(newTop, vpRect.height - 40));

            btn.style.left = newLeft + 'px';
            btn.style.top = newTop + 'px';
        }

        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // Klikk sjekker kun virtuell cursor
    btn.addEventListener('click', () => {
        if (!vmToggle.checked) {
            status.innerText = "Status: FEIL — ekte mus er deaktivert.";
            return;
        }

        const btnRect = btn.getBoundingClientRect();
        const vpRect = vp.getBoundingClientRect();

        const cx = cursorX + vpRect.left;
        const cy = cursorY + vpRect.top;

        if (cx > btnRect.left && cx < btnRect.right &&
            cy > btnRect.top && cy < btnRect.bottom) {

            alert("SYSTEM_FEIL: Du klikka med virtuell touchpad-mus. Respekt.");
            location.reload();
        } else {
            status.innerText = "Status: FEIL_KURSOR.POSISJON";
        }
    });
</script>

</body>
</html>
