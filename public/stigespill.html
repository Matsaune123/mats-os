<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // Heis & Zipline</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Sørger for at brettet er relativt så brikken kan flyte fritt oppå */
        #game-board { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr) var(--gap-width, 10px) repeat(5, 1fr); 
            gap: 2px; 
            width: 100%;
            max-width: 100%;
            margin: 15px auto;
            padding: 5px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 4px;
            --gap-width: 12px;
            box-sizing: border-box;
            position: relative; /* Kritisk for jevn brikkebevegelse */
        }
        
        .cell { 
            aspect-ratio: 1;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            border-radius: 3px; 
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #1f2937;
            min-width: 0;
            box-sizing: border-box;
        }
        
        .b-left { 
            background: rgba(0, 255, 102, 0.02); 
            border-color: rgba(0, 255, 102, 0.15); 
            color: var(--primary-color);
        } 
        
        .b-right { 
            background: rgba(255, 170, 0, 0.02); 
            border-color: rgba(255, 170, 0, 0.15); 
            color: #ffaa00; 
        } 
        
        .gap-col { 
            background: transparent; 
            border: none; 
            position: relative;
        }
        .gap-col::before {
            content: "||";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1f2937;
            font-size: 9px;
        }
        
        /* GLATT OG SPRETTEN BEVEGELSE */
        .player { 
            width: 12px; 
            height: 12px; 
            background: var(--error); 
            border-radius: 50%; 
            position: absolute; 
            box-shadow: 0 0 10px var(--error); 
            z-index: 10;
            pointer-events: none;
            /* Sentrerer brikken på koordinatene */
            transform: translate(-50%, -50%); 
            /* Glir sidelengs/oppover uten hakking */
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hopper opp i en bue KUN under selve flyttingen */
        .player.moving {
            animation: hop 0.4s ease-in-out;
        }

        @keyframes hop {
            0% { transform: translate(-50%, -50%) scale(1, 1); }
            50% { transform: translate(-50%, -180%) scale(1.3, 1.3); box-shadow: 0 10px 15px rgba(0,0,0,0.7); }
            100% { transform: translate(-50%, -50%) scale(1, 1); }
        }
        
        .info { font-size: 7px; color: #fff; margin-top: 1px; text-shadow: 1px 1px 1px #000; text-align: center; white-space: nowrap; }
        .elevator-cell { background: rgba(255, 255, 255, 0.08) !important; border-color: #fff !important; }
        
        .game-btn { 
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 0 auto 15px auto;
            padding: 12px; 
            background: transparent; 
            color: var(--primary-color); 
            border: 2px solid var(--primary-color); 
            cursor: pointer; 
            font-family: monospace; 
            font-size: 14px;
            font-weight: bold; 
        }
        .game-btn:hover { 
            background: var(--primary-color); 
            color: var(--background);
            box-shadow: 0 0 10px var(--primary-color);
        }
        .game-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        #terminal-log {
            height: 90px;
            overflow-y: auto;
            text-align: left;
            background: #05070b;
            padding: 10px;
            border: 1px dashed var(--text-dim);
            font-family: monospace;
            font-size: 11px;
            color: var(--primary-color);
            margin: 0 auto 15px auto;
            max-width: 100%;
        }
        .log-error { color: var(--error); }
        .log-warn { color: #ffaa00; }
        .log-success { color: #00ff66; text-shadow: 0 0 4px #00ff66; }

        @media (max-width: 600px) {
            .content { padding: 10px !important; }
        }

        @media (min-width: 600px) {
            #game-board {
                --gap-width: 80px;
                gap: 5px;
                max-width: 750px;
            }
            .cell { font-size: 12px; }
            .info { font-size: 9px; }
            .player { width: 16px; height: 16px; }
            .gap-col::before {
                content: "AVGRUNN";
                transform: translate(-50%, -50%) rotate(-90deg);
                font-size: 9px;
                letter-spacing: 4px;
            }
            #terminal-log { font-size: 12px; height: 120px; }
        }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🏙️ MATS-OS</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="window">
            <div class="title-bar">
                <span>heis_rulett.exe</span>
                <a href="kaos_hub.html" class="nav-back">[ BACK ]</a>
            </div>
            
            <div class="content">
                <h1>🏙️ Tårn-Rulett</h1>
                <p>Zipliner (🚡) dumper deg nedover til nabobygget. Heiser (🛗) er 50/50 rulett innad i tårnet.</p>
                
                <button class="game-btn" id="rollBtn" onclick="roll()">Trill Terning [SPACE]</button>
                
                <div id="terminal-log">
                    <div>> Kinematikk-motor kalibrert. CSS-buelinjeglide aktivert.</div>
                </div>
                
                <div id="game-board"></div>
            </div>
        </div>
    </div>

    <script>
        const ziplines = {
            98: { to: 68, icon: '🚡', desc: 'Zipline knakk! Sklir ned til Høyre Tårn felt 68.' },
            87: { to: 58, icon: '🚡', desc: 'Zipline sviktet! Sklir ned til Venstre Tårn felt 58.' },
            63: { to: 33, icon: '🚡', desc: 'Zipline kollapset! Sklir ned til Høyre Tårn felt 33.' },
            72: { to: 42, icon: '🚡', desc: 'Zipline revnet! Sklir ned til Venstre Tårn felt 42.' }
        };

        const elevators = {
            18: { up: 83, down: 3, side: 'Venstre' },
            29: { up: 89, down: 8, side: 'Høyre' },
            44: { up: 99, down: 23, side: 'Venstre' },
            53: { up: 94, down: 13, side: 'Høyre' }
        };

        const board = document.getElementById('game-board');
        const rollBtn = document.getElementById('rollBtn');
        let pos = 1;
        let isMoving = false;

        // Bygg brettet
        for (let row = 9; row >= 0; row--) {
            for (let track = 0; track < 11; track++) {
                if (track === 5) {
                    let gap = document.createElement('div');
                    gap.className = 'gap-col';
                    board.appendChild(gap);
                    continue;
                }
                
                let gameCol = (track < 5) ? track : track - 1;
                let actualGameCol = (row % 2 === 0) ? gameCol : 9 - gameCol;
                let num = row * 10 + actualGameCol + 1;
                
                let isLeftTower = track < 5;
                let cell = document.createElement('div');
                cell.id = 'cell-' + num;
                cell.className = 'cell ' + (isLeftTower ? 'b-left' : 'b-right');
                cell.innerHTML = `<div>${num}</div>`;
                
                if (ziplines[num]) {
                    cell.innerHTML += `<div class="info">🚡 v${ziplines[num].to}</div>`;
                } else if (elevators[num]) {
                    cell.className += ' elevator-cell';
                    cell.innerHTML += `<div class="info">🛗 RNG</div>`;
                }
                
                board.appendChild(cell);
            }
        }

        // Generer eller oppdater posisjonen til brikken trinnløst
        function updateBoard(animate = true) {
            let playerDot = document.getElementById('player-token');
            if (!playerDot) {
                playerDot = document.createElement('div');
                playerDot.id = 'player-token';
                playerDot.className = 'player';
                board.appendChild(playerDot);
            }
            
            let targetCell = document.getElementById('cell-' + pos);
            if (targetCell) {
                if (!animate) {
                    playerDot.style.transition = 'none';
                } else {
                    playerDot.style.transition = 'left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                    playerDot.classList.add('moving');
                    setTimeout(() => playerDot.classList.remove('moving'), 400);
                }
                
                // Kalkulerer midtpunktet av ruten relativt til brettet
                let x = targetCell.offsetLeft + (targetCell.offsetWidth / 2);
                let y = targetCell.offsetTop + (targetCell.offsetHeight / 2);
                
                playerDot.style.left = x + 'px';
                playerDot.style.top = y + 'px';
            }
        }

        function logTerminal(msg, type = '') {
            const term = document.getElementById('terminal-log');
            const p = document.createElement('div');
            if (type) p.className = type;
            p.innerText = `> ${msg}`;
            term.appendChild(p);
            term.scrollTop = term.scrollHeight;
        }

        function roll() {
            if (isMoving) return;
            if (pos === 100) return logTerminal("Du vant allerede. Restarter ikke.", "log-success");
            
            isMoving = true;
            rollBtn.disabled = true;
            let dice = Math.floor(Math.random() * 6) + 1;
            logTerminal(`Kaster terning... Verdi: ${dice}`);
            
            let target = pos + dice;
            if (target > 100) {
                target = 100 - (target - 100);
                logTerminal(`Overflow! Spratt tilbake til felt ${target}.`, "log-error");
            }
            
            pos = target;
            updateBoard(true);
            
            if (pos === 100) {
                logTerminal("🎉 SYSTEMFEIL ELIMINERT. Du nådde toppen!", "log-success");
                isMoving = false;
                return;
            }

            setTimeout(() => {
                if (ziplines[pos]) {
                    let zip = ziplines[pos];
                    logTerminal(`TRIGGER: ${zip.desc}`, "log-error");
                    pos = zip.to;
                    setTimeout(() => { updateBoard(true); endTurn(); }, 500);
                } 
                else if (elevators[pos]) {
                    logTerminal(`🛗 HEIS DETEKTERT (${elevators[pos].side} Tårn)...`, "log-warn");
                    
                    setTimeout(() => {
                        let lucky = Math.random() >= 0.5;
                        let eData = elevators[pos];
                        
                        if (lucky) {
                            pos = eData.up;
                            logTerminal(`HYDRAULIKK HOLDT! Skutt opp til felt ${pos}.`, "log-success");
                        } else {
                            pos = eData.down;
                            logTerminal(`KABELBRUDD! Dundret ned til felt ${pos}.`, "log-error");
                        }
                        updateBoard(true);
                        endTurn();
                    }, 1000);
                } 
                else {
                    endTurn();
                }
            }, 500); // Venter til hoppet er ferdig før eventuelle triggers sjekkes
        }

        function endTurn() {
            isMoving = false;
            rollBtn.disabled = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isMoving) {
                e.preventDefault();
                roll();
            }
        });

        // Sørger for at brikken ikke blir feilplassert hvis du snur mobilen eller endrer vindusstørrelse
        window.addEventListener('resize', () => updateBoard(false));

        // Plasser brikken umiddelbart ved oppstart uten animasjon
        updateBoard(false);
    </script>
</body>
</html>
