<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // Heis & Zipline</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Absolutt kontroll på rutenettet: 5 rom, 100px chasm, 5 rom */
        #game-board { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr) 100px repeat(5, 1fr); 
            gap: 5px; 
            max-width: 750px;
            margin: 20px auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        
        .cell { 
            aspect-ratio: 1;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            border-radius: 3px; 
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #1f2937;
        }
        
        /* Venstre Bygg (Grønn sone) */
        .b-left { 
            background: rgba(0, 255, 102, 0.02); 
            border-color: rgba(0, 255, 102, 0.15); 
            color: var(--primary-color);
        } 
        
        /* Høyre Bygg (Oransje/Advarsel sone) */
        .b-right { 
            background: rgba(255, 170, 0, 0.02); 
            border-color: rgba(255, 170, 0, 0.15); 
            color: #ffaa00; 
        } 
        
        /* Det faktiske tomrommet mellom skyskraperne */
        .gap-col { 
            background: transparent; 
            border: none; 
            position: relative;
        }
        .gap-col::before {
            content: "AVGRUNN";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            color: #1f2937;
            font-size: 9px;
            letter-spacing: 4px;
        }
        
        .player { 
            width: 16px; 
            height: 16px; 
            background: var(--error); 
            border-radius: 50%; 
            position: absolute; 
            box-shadow: 0 0 15px var(--error); 
            z-index: 10;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.2); }
        }
        
        .info { font-size: 9px; color: #fff; margin-top: 2px; text-shadow: 1px 1px 1px #000; }
        .elevator-cell { background: rgba(255, 255, 255, 0.08) !important; border-color: #fff !important; }
        
        .game-btn { 
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 0 auto 20px auto;
            padding: 12px; 
            background: transparent; 
            color: var(--primary-color); 
            border: 2px solid var(--primary-color); 
            cursor: pointer; 
            font-family: monospace; 
            font-size: 15px;
            font-weight: bold; 
        }
        .game-btn:hover { 
            background: var(--primary-color); 
            color: var(--background);
            box-shadow: 0 0 10px var(--primary-color);
        }
        .game-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        #terminal-log {
            height: 120px;
            overflow-y: auto;
            text-align: left;
            background: #05070b;
            padding: 10px;
            border: 1px dashed var(--text-dim);
            font-family: monospace;
            font-size: 12px;
            color: var(--primary-color);
            margin: 0 auto 20px auto;
            max-width: 750px;
        }
        .log-error { color: var(--error); }
        .log-warn { color: #ffaa00; }
        .log-success { color: #00ff66; text-shadow: 0 0 4px #00ff66; }
    </style>
</head>
<body>

    <nav class="global-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">🏙️ MATS-OS</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="window">
            <div class="title-bar">
                <span>heis_rulett.exe</span>
                <a href="kaos_hub.html" class="nav-back">[ BACK ]</a>
            </div>
            
            <div class="content">
                <h1>🏙️ Tårn-Rulett</h1>
                <p>Byggene er fysisk separert. Zipliner (🚡) dumper deg nedover til nabobygget. Heiser (🛗) er 50/50 rulett innad i tårnet.</p>
                
                <button class="game-btn" id="rollBtn" onclick="roll()">Trill Terning [SPACE]</button>
                
                <div id="terminal-log">
                    <div>> Matrix lastet. Alle 100 rom verifisert. Spiller på felt 1.</div>
                </div>
                
                <div id="game-board"></div>
            </div>
        </div>
    </div>

    <script>
        // Nådeløse zipliner som KUN går nedover og over gapet
        const ziplines = {
            98: { to: 68, icon: '🚡', desc: 'Zipline knakk! Sklir ned til Høyre Tårn felt 68.' },
            87: { to: 58, icon: '🚡', desc: 'Zipline sviktet! Sklir ned til Venstre Tårn felt 58.' },
            63: { to: 33, icon: '🚡', desc: 'Zipline kollapset! Sklir ned til Høyre Tårn felt 33.' },
            72: { to: 42, icon: '🚡', desc: 'Zipline revnet! Sklir ned til Venstre Tårn felt 42.' }
        };

        // Heis-rulett: 50% sjanse for Toppen, 50% sjanse for Kabelkutt til bunnen
        const elevators = {
            18: { up: 83, down: 3, side: 'Venstre' },
            29: { up: 89, down: 8, side: 'Høyre' },
            44: { up: 99, down: 23, side: 'Venstre' },
            53: { up: 94, down: 13, side: 'Høyre' }
        };

        const board = document.getElementById('game-board');
        const rollBtn = document.getElementById('rollBtn');
        let pos = 1;
        let isMoving = false;

        // Genererer brettet via fysiske spor for å garantere tomrommet og alle 100 rom
        for (let row = 9; row >= 0; row--) {
            for (let track = 0; track < 11; track++) {
                // Sjekk om dette er sporet til tomrommet i midten
                if (track === 5) {
                    let gap = document.createElement('div');
                    gap.className = 'gap-col';
                    board.appendChild(gap);
                    continue;
                }
                
                // Konverter fysisk spor til spill-kolonne (0-9)
                let gameCol = (track < 5) ? track : track - 1;
                
                // Sikksakk-beregning basert på raden
                let actualGameCol = (row % 2 === 0) ? gameCol : 9 - gameCol;
                let num = row * 10 + actualGameCol + 1;
                
                let isLeftTower = track < 5;
                let cell = document.createElement('div');
                cell.id = 'cell-' + num;
                cell.className = 'cell ' + (isLeftTower ? 'b-left' : 'b-right');
                cell.innerHTML = `<div>${num}</div>`;
                
                if (ziplines[num]) {
                    cell.innerHTML += `<div class="info">🚡 v${ziplines[num].to}</div>`;
                } else if (elevators[num]) {
                    cell.className += ' elevator-cell';
                    cell.innerHTML += `<div class="info">🛗 RUSETT</div>`;
                }
                
                board.appendChild(cell);
            }
        }

        function logTerminal(msg, type = '') {
            const term = document.getElementById('terminal-log');
            const p = document.createElement('div');
            if (type) p.className = type;
            p.innerText = `> ${msg}`;
            term.appendChild(p);
            term.scrollTop = term.scrollHeight;
        }

        function updateBoard() {
            document.querySelectorAll('.player').forEach(e => e.remove());
            let currentCell = document.getElementById('cell-' + pos);
            if(currentCell) {
                let playerDot = document.createElement('div');
                playerDot.className = 'player';
                currentCell.appendChild(playerDot);
            }
        }

        function roll() {
            if (isMoving) return;
            if (pos === 100) return logTerminal("Du vant allerede. Restarter ikke.", "log-success");
            
            isMoving = true;
            rollBtn.disabled = true;
            let dice = Math.floor(Math.random() * 6) + 1;
            logTerminal(`Kaster terning... Verdi: ${dice}`);
            
            let target = pos + dice;
            if (target > 100) {
                target = 100 - (target - 100);
                logTerminal(`Overflow! Spratt tilbake til felt ${target}.`, "log-error");
            }
            
            pos = target;
            updateBoard();
            
            if (pos === 100) {
                logTerminal("🎉 SKYSKRAPER ERRORET UNNLØPT. Du nådde toppen!", "log-success");
                isMoving = false;
                return;
            }

            setTimeout(() => {
                if (ziplines[pos]) {
                    let zip = ziplines[pos];
                    logTerminal(`TRIGGER: ${zip.desc}`, "log-error");
                    pos = zip.to;
                    setTimeout(() => { updateBoard(); endTurn(); }, 600);
                } 
                else if (elevators[pos]) {
                    logTerminal(`🛗 HEIS DETEKTERT (${elevators[pos].side} Tårn). Kalkulerer overlevelsesrate...`, "log-warn");
                    
                    setTimeout(() => {
                        let lucky = Math.random() >= 0.5;
                        let eData = elevators[pos];
                        
                        if (lucky) {
                            pos = eData.up;
                            logTerminal(`HYDRAULIKK HOLDT! Heisen skjøt opp til felt ${pos}.`, "log-success");
                        } else {
                            pos = eData.down;
                            logTerminal(`KABELBRUDD! Heisen dundret ned til felt ${pos}.`, "log-error");
                        }
                        updateBoard();
                        endTurn();
                    }, 1000);
                } 
                else {
                    endTurn();
                }
            }, 600);
        }

        function endTurn() {
            isMoving = false;
            rollBtn.disabled = false;
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isMoving) {
                e.preventDefault();
                roll();
            }
        });

        updateBoard();
    </script>
</body>
</html>
