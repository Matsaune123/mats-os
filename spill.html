<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATS-OS // Glatt SirkelSpill</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 10px; }
        canvas { background: #111; border: 2px solid #444; display: block; margin: 10px auto; max-width: 100%; height: auto; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #222; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; }
        #login-screen input { padding: 12px; font-size: 16px; border-radius: 4px; border: none; width: 250px; margin-bottom: 10px; text-align: center; }
        #login-screen button { padding: 12px 24px; font-size: 16px; background: #0076ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>MATS-OS SirkelSpill</h2>
        <input type="text" id="nameInput" placeholder="Navn..." maxlength="15">
        <button id="joinBtn">Bli med</button>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let players = {}; // Faktisk posisjon fra server
        let render = {};  // Visuell posisjon (den glatte)
        let myName = "Anonym";
        const speed = 5;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        document.getElementById('joinBtn').onclick = () => {
            myName = document.getElementById('nameInput').value || "Anonym";
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
        };

        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Interpolasjon-funksjon: Deler avstanden til målet
        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function update() {
            if (players[socket.id]) {
                let p = players[socket.id];
                if (keys.ArrowUp) p.y -= speed;
                if (keys.ArrowDown) p.y += speed;
                if (keys.ArrowLeft) p.x -= speed;
                if (keys.ArrowRight) p.x += speed;
                
                // Bounds
                p.x = Math.max(20, Math.min(780, p.x));
                p.y = Math.max(20, Math.min(480, p.y));
                p.name = myName;
                socket.emit('movement', p);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, 800, 500);
            for (let id in players) {
                if (!render[id]) render[id] = { x: players[id].x, y: players[id].y };
                
                // Gjør avstanden mellom faktisk og visuell posisjon mindre for hver frame (0.2 = 20% av veien)
                render[id].x = lerp(render[id].x, players[id].x, 0.2);
                render[id].y = lerp(render[id].y, players[id].y, 0.2);

                ctx.beginPath();
                ctx.arc(render[id].x, render[id].y, 20, 0, Math.PI * 2);
                ctx.fillStyle = (id === socket.id) ? '#ff3b30' : '#007aff';
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillText(players[id].name, render[id].x, render[id].y - 28);
            }
            requestAnimationFrame(draw);
        }

        socket.on('currentPlayers', (data) => players = data);
        socket.on('playerMoved', (data) => players[data.id] = data);
        socket.on('newPlayer', (data) => players[data.id] = data);
        socket.on('playerDisconnected', (id) => { delete players[id]; delete render[id]; });

        setInterval(update, 1000/60); // 60 FPS logikk
        draw();
    </script>
</body>
</html>
